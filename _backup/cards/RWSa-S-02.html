<body>
<nav class="nav"><a href="../index.html">← 全部牌面</a></nav>
<div class="stage"><div class="card" id="card"><canvas id="gl"></canvas><canvas id="fx"></canvas><div class="glare" id="glare"></div></div></div>
<p class="hint" id="hint">正在拆分图层…</p>
<script src="../assets/cards/RWSa-S-02.js"></script>
<script src="../engine/live2d-card.js"></script>
<script>
const { W } = Live2DCard;
const sm = (a, b, v) => { const t = Math.max(0, Math.min(1, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
const MOON = [765, 255];
const moonPulse = e => .5 + .5 * Math.sin(e.t * .8);
// 剑身权重：剑尖（贴边框）为 0，沿剑身向护手渐增到 k
const blade = (ax, ay, bx, by, k) => (x, y) => {
  const vx = bx - ax, vy = by - ay, t = Math.max(0, Math.min(1, ((x - ax) * vx + (y - ay) * vy) / (vx * vx + vy * vy)));
  const d = Math.hypot(x - ax - vx * t, y - ay - vy * t);
  return k * (1 - sm(40, 62, d)) * sm(.1, .95, t);
};
// 呼吸：躯干为 1，石凳以下衰减到 0；两把剑以较小权重并入同一根缩放骨骼（极轻起伏）
const W_BODY = W.mul(W.ell(530, 950, 260, 450, .5), W.bandY(1430, 1260));
const W_ALL = W.max(W_BODY, blade(45, 205, 440, 790, .6), blade(1035, 205, 635, 780, .6));
// 海面亮带上的波光点（避开人物与两座小岛）
const GLINTS = [
  [90, 915], [180, 935], [290, 912], [360, 950], [720, 915], [800, 940], [930, 925], [1000, 945],
  [100, 975], [240, 970], [740, 980], [880, 1030], [980, 1040], [700, 1050],
  [80, 1080], [180, 1100], [300, 1090], [360, 1130], [720, 1100], [820, 1120], [940, 1095],
  [120, 1150], [250, 1170], [700, 1160], [880, 1170], [990, 1150], [160, 1220], [330, 1215], [760, 1225], [930, 1210],
];

Live2DCard.run({
  title: "宝剑二 Two of Swords",
  // 剑尖贴左右上角边框，保持原样
  keepRects: [{ rect: [40, 180, 140, 330] }, { rect: [946, 180, 1046, 330] }],
  layers: [
    // 人物与剑背后都是蓝色网点，抠不干净 → noHole + 轮廓内局部形变（轮廓边缘权重为 0）
    { name: "figure", blur: 1, step: 8, noHole: true,
      poly: [[40, 180], [1046, 180], [1046, 1460], [40, 1460]],
      bones: [
        { scale: [530, 1440], w: W_ALL, sx: e => .004 * e.breath * e.amp, sy: e => .007 * e.breath * e.amp },
      ] },
  ],
  glows: [
    { x: MOON[0], y: MOON[1], r0: 30, r1: e => 130 + 20 * moonPulse(e), color: [255, 240, 170], a: e => .1 + .1 * moonPulse(e) },
    { x: MOON[0] + 15, y: MOON[1], r1: e => 65 + 6 * moonPulse(e), color: [255, 252, 225], a: e => .07 + .08 * moonPulse(e) },
  ],
  motes: { n: 12, rect: [58, 40, 1028, 880], speed: [1, 3], dir: -1, color: [240, 248, 255] },
  fx(g, e) {
    g.save(); g.globalCompositeOperation = "lighter";
    // 海面波光：错相闪烁的横向亮线
    GLINTS.forEach(([x, y], i) => {
      const k = Math.max(0, Math.sin(e.t * 1.3 + i * 2.17));
      const a = .45 * k * k;
      if (a < .01) return;
      const dx = 6 * Math.sin(e.t * .6 + i), L = 10 + 12 * k;
      const gr = g.createLinearGradient(x + dx - L, y, x + dx + L, y);
      gr.addColorStop(0, "rgba(235,250,255,0)"); gr.addColorStop(.5, `rgba(235,250,255,${a})`); gr.addColorStop(1, "rgba(235,250,255,0)");
      g.fillStyle = gr; g.beginPath(); g.ellipse(x + dx, y, L, 1.8, 0, 0, 7); g.fill();
    });
    g.restore();
  },
});
</script>
