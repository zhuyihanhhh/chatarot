<div class="stage"><div class="card" id="card"><canvas id="gl"></canvas><canvas id="fx"></canvas><div class="glare" id="glare"></div></div></div>
<p class="hint" id="hint">正在拆分图层…</p>
<script src="../assets/cards/RWSa-P-09.js"></script>
<script src="../engine/live2d-card.js"></script>
<script>
const { W } = Live2DCard;
// 九枚星币：左侧六枚 + 右侧三枚
const COINS = [[204, 1075], [104, 1227], [264, 1227], [164, 1373], [104, 1515], [264, 1515], [885, 1278], [736, 1351], [891, 1478]]
  .map((c, i) => ({ c, ph: i * 2.39 }));
const shine = (s, e) => { const k = .5 + .5 * Math.sin(e.t * 1.3 + s.ph); return k * k; };
// 鹰：偶尔点头 + 抖一下
const peck = t => { const p = t % 5.3; return p < .9 ? Math.sin(p / .9 * Math.PI * 2) * Math.sin(p / .9 * Math.PI) : 0; };
const shake = t => { const p = (t + 2.4) % 7.1; return p < .5 ? Math.sin(p * 60) * (1 - p / .5) : 0; };
// 鹰身：从爪部向上，爪/手处为 0
const W_HAWK = W.mul(W.cap(772, 535, 748, 360, 32, 62), W.bandY(560, 530));
// 头：脖子以下为 0
const W_HEAD = W.mul(W.ell(560, 445, 95, 110, .45), W.bandY(585, 545));
// 长袍呼吸：底部和两侧星币处为 0
const W_BODY = W.mul(W.ell(530, 900, 220, 330, .5), W.bandY(1330, 1200), W.bandY(575, 620));
// 葡萄藤：贴边框处为 0
const W_VINE_L = W.mul(W.ell(165, 830, 115, 175, .4), W.bandX(66, 110));
const W_VINE_R = W.mul(W.ell(905, 960, 110, 250, .4), W.bandX(1020, 975));
const vineWave = w => ({ wave: 1, w, ph: (x, y, e) => e.t * 1.7 - y * .008 + x * .005,
  ax: e => (1.2 + 3 * e.wind) * e.amp, ay: e => (.4 + .8 * e.wind) * e.amp });

Live2DCard.run({
  title: "星币九 Nine of Pentacles",
  art: [58, 40, 1028, 1752],
  springs: {
    head: { k: 9, c: 4.5, target: e => e.amp * .02 * e.n(e.t * .25 + 1) + .012 * e.mx },
  },
  layers: [
    // 背景是网点纸纹 / 杂乱花园 → noHole + 轮廓内衰减
    { name: "vineL", blur: 1, step: 8, noHole: true,
      poly: [[60,640],[290,640],[290,1020],[60,1020]], bones: [vineWave(W_VINE_L)] },
    { name: "vineR", blur: 1, step: 8, noHole: true,
      poly: [[780,640],[1028,640],[1028,1230],[780,1230]], bones: [vineWave(W_VINE_R)] },
    { name: "lady", blur: 1, step: 6, noHole: true,
      poly: [[460,340],[660,340],[700,560],[760,640],[760,1330],[300,1330],[330,640],[440,560]],
      bones: [
        { rot: [560, 565], w: W_HEAD, a: e => e.s.head.x },
        { scale: [530, 1320], w: W_BODY, sx: e => .003 * e.breath * e.amp, sy: e => .007 * e.breath * e.amp },
      ] },
    { name: "hawk", blur: 1, step: 5, noHole: true,
      poly: [[700,310],[790,310],[830,470],[860,560],[700,560]],
      bones: [{ rot: [772, 548], w: W_HAWK, a: e => e.amp * (.05 * peck(e.t) + .015 * shake(e.t) + .008 * Math.sin(e.t * .9)) }] },
  ],
  glows: COINS.map(s => ({ x: s.c[0], y: s.c[1], r0: 20, r1: e => 110 + 20 * shine(s, e), color: [255, 230, 130], a: e => .05 + .18 * shine(s, e) })),
  motes: { n: 20, rect: [58, 40, 1028, 1700], speed: [2, 5], dir: -1, color: [255, 240, 170] },
});
</script>
