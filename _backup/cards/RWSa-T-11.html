<head>

<title>塔罗 · XI 正义 Justice</title>

</head>
<body>
<nav class="nav"><a href="../index.html">← 全部牌面</a></nav>
<div class="stage"><div class="card" id="card"><canvas id="gl"></canvas><canvas id="fx"></canvas><div class="glare" id="glare"></div></div></div>
<p class="hint" id="hint">正在拆分图层…</p>
<script src="../assets/cards/RWSa-T-11.js"></script>
<script src="../engine/live2d-card.js"></script>
<script>
const { W } = Live2DCard;
const HAND = [889, 842];   // 天平吊点（握在手中）
const HOOK = [980, 918];   // 右秤盘挂钩
// 剑刃（剑尖 → 护手）
const BLADE = [[128, 42], [158, 42], [160, 570], [122, 570]];

Live2DCard.run({
  title: "XI 正义 Justice",
  key: { colors: [[191, 177, 173], [196, 183, 179], [189, 175, 172], [244, 232, 114]] },
  keepRects: [
    { rect: [858, 826, 918, 856] },   // 手与天平柄交界
    { rect: [862, 905, 878, 960] },   // 横梁左端截断处（左秤盘压在长袍上，静止）
    { rect: [987, 880, 1008, 1140] }, // 右柱黑色边线（秤盘吊绳与其相连）
  ],
  springs: {
    scale: { k: 5,  c: .7, force: e => e.amp * (.05 * e.n(e.t * .45 + 2) + .02 * e.mx) },
    panR:  { k: 9,  c: .6, force: e => -1.4 * e.s.scale.a + e.amp * .03 * e.n(e.t * .9 + 5) },
    head:  { k: 9,  c: 4.5, target: e => e.amp * .02 * e.n(e.t * .23 + 1) + .012 * e.mx },
  },
  layers: [
    { name: "fig", blur: 1, step: 10,
      poly: [[432,388],[462,384],[470,398],[494,396],[500,382],[526,382],[532,396],[560,396],[566,382],[594,386],[590,470],[612,490],[618,560],[612,600],[650,610],[700,640],[700,880],[330,880],[330,650],[380,615],[412,600],[406,560],[410,490],[432,470]],
      bones: [
        { rot: [510, 625], w: W.mul(W.ell(510, 480, 125, 160), W.bandY(650, 600)), a: e => e.s.head.x },
        { scale: [510, 880], w: W.ell(510, 735, 150, 135, .5), sx: e => .004 * e.breath * e.amp, sy: e => .008 * e.breath * e.amp },
      ] },
    { name: "scale", key: true, blur: .8, step: 6,
      // 右柱黑色边线（x≈988..1006）与吊绳、秤盘交叉：两侧分开抠，交叉处由静止的黑线覆盖
      polys: [
        [[868,846],[912,846],[912,918],[966,918],[968,903],[989,903],[989,1114],[948,1114],[936,1080],[952,1062],[972,940],[912,952],[912,1008],[868,1008]],
        [[1007,950],[1031,950],[1031,1114],[1007,1114]],
      ],
      bones: [
        { rot: HOOK, w: W.mul(W.bandY(932, 952), W.bandX(936, 950)), a: e => e.s.panR.x },
        { rot: HAND, w: W.mul(W.bandY(848, 880), W.bandX(868, 878)), a: e => e.s.scale.x },
      ] },
  ],
  glows: [
    { x: 510, y: 420, r1: 120, color: [255, 240, 170], a: e => .06 + .05 * (.5 + .5 * Math.sin(e.t * 1.3)) },
  ],
  motes: { n: 18, rect: [58, 40, 1028, 1400], speed: [3, 8] },
  fx(g, e) {
    // 剑刃高光：一道亮带由护手扫向剑尖，间歇出现
    const p = (e.t % 4.5) / 1.6; if (p > 1) return;
    const y = 570 - p * 560, a = Math.sin(p * Math.PI);
    g.save(); g.beginPath(); BLADE.forEach((q, i) => i ? g.lineTo(...q) : g.moveTo(...q)); g.closePath(); g.clip();
    g.globalCompositeOperation = "lighter";
    const gr = g.createLinearGradient(0, y - 60, 0, y + 60);
    gr.addColorStop(0, "rgba(255,255,255,0)"); gr.addColorStop(.5, `rgba(255,255,255,${.75 * a})`); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(110, y - 60, 60, 120);
    g.restore();
    g.save(); g.globalCompositeOperation = "lighter";
    const rg = g.createRadialGradient(141, y, 0, 141, y, 40);
    rg.addColorStop(0, `rgba(230,245,255,${.35 * a})`); rg.addColorStop(1, "rgba(230,245,255,0)");
    g.fillStyle = rg; g.fillRect(101, y - 40, 80, 80);
    g.restore();
  },
});
</script>
</body>
</html>
