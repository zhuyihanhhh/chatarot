<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>塔罗 · 宝剑国王 King of Swords</title>
<link rel="stylesheet" href="../engine/card.css" />
</head>
<body>
<nav class="nav"><a href="../index.html">← 全部牌面</a></nav>
<div class="stage"><div class="card" id="card"><canvas id="gl"></canvas><canvas id="fx"></canvas><div class="glare" id="glare"></div></div></div>
<p class="hint" id="hint">正在拆分图层…</p>
<script src="../assets/cards/RWSa-S-KI.js"></script>
<script src="../engine/live2d-card.js"></script>
<script>
const { W } = Live2DCard;
// 头部（含王冠）：以颈部为枢轴；左侧剑身处衰减到 0
const W_HEAD = W.mul(W.ell(485, 420, 95, 130, .45), W.bandX(375, 410));
// 呼吸：胸腹；左侧握剑手与剑格处衰减到 0，剑保持静止
const W_BREATH = W.mul(W.ell(530, 760, 190, 200, .5), W.bandX(390, 450));
// 两侧树冠：背后是网点云，抠不干净 → 只做树冠内部的小幅 wave，边缘衰减到 0
const W_TREE_L = W.mul(W.ell(105, 1270, 80, 75, .5), W.bandX(62, 80));
const W_TREE_R = W.mul(W.ell(960, 1260, 95, 90, .5), W.bandX(1020, 1000));
const FOG = [
  { y: 700, h: 70, w: 220, sp: 8, ph: 0 },
  { y: 1180, h: 70, w: 260, sp: 6, ph: 500 },
  { y: 1330, h: 60, w: 240, sp: 9, ph: 250 },
];

Live2DCard.run({
  title: "宝剑国王 King of Swords",
  springs: {
    head: { k: 9, c: 4.5, target: e => e.amp * .02 * e.n(e.t * .25 + 1) + .012 * e.mx },
  },
  keepRects: [{ rect: [1010, 1150, 1040, 1480] }, { rect: [40, 1150, 70, 1480] }],
  layers: [
    { name: "trees", blur: 1, step: 8, noHole: true,
      polys: [
        [[62,1190],[195,1190],[195,1360],[62,1360]],
        [[850,1160],[1025,1160],[1025,1380],[850,1380]],
      ],
      bones: [
        { wave: 1, w: W_TREE_L, ph: (x, y, e) => e.t * 1.4 - y * .02, ax: e => (1 + 2.5 * e.wind) * e.amp, ay: e => .3 * e.amp },
        { wave: 1, w: W_TREE_R, ph: (x, y, e) => e.t * 1.3 - y * .02 + 2, ax: e => (1 + 2.5 * e.wind) * e.amp, ay: e => .3 * e.amp },
      ] },
    // 国王背后是王座浮雕，抠不干净 → noHole + 轮廓内局部形变
    { name: "king", blur: 1, step: 8, noHole: true,
      poly: [[380,280],[600,280],[640,560],[720,700],[740,960],[330,960],[360,700],[370,560]],
      bones: [
        { rot: [485, 545], w: W_HEAD, a: e => e.s.head.x },
        { scale: [530, 960], w: W_BREATH, sx: e => .004 * e.breath * e.amp, sy: e => .008 * e.breath * e.amp },
      ] },
  ],
  motes: { n: 12, rect: [58, 40, 1028, 1450], speed: [3, 7], dir: 1, color: [255, 255, 255] },
  fx(g, e) {
    // 云上叠雾气横移
    g.save();
    for (const f of FOG) {
      const span = 970 + f.w * 2;
      const x = 58 - f.w + ((e.t * f.sp * (1 + .5 * e.wind) + f.ph) % span);
      const a = .1 + .05 * Math.sin(e.t * .4 + f.ph);
      const gr = g.createRadialGradient(x, f.y, 0, x, f.y, f.w);
      gr.addColorStop(0, `rgba(255,255,255,${a})`); gr.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = gr; g.beginPath(); g.ellipse(x, f.y, f.w, f.h, 0, 0, 7); g.fill();
    }
    g.restore();
  },
});
</script>
</body>
</html>
