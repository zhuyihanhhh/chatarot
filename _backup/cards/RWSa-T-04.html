<title>塔罗 · IV 皇帝 The Emperor</title>

</head>
<body>
<nav class="nav"><a href="../index.html">← 全部牌面</a></nav>
<div class="stage"><div class="card" id="card"><canvas id="gl"></canvas><canvas id="fx"></canvas><div class="glare" id="glare"></div></div></div>
<p class="hint" id="hint">正在拆分图层…</p>
<script src="../assets/cards/RWSa-T-04.js"></script>
<script src="../engine/live2d-card.js"></script>
<script>
const { W } = Live2DCard;
const ANKH = [165, 505], ORB = [865, 840];
// 石座、山体复杂且与人物描边相连：不挖洞，人物层取原图，骨骼权重只在内部，轮廓处为 0
Live2DCard.run({
  title: "IV 皇帝 The Emperor",
  springs: {
    head:  { k: 8, c: 4.5, target: e => e.amp * .014 * e.n(e.t * .2 + 1) + .008 * e.mx },
    beard: { k: 30, c: 3,  force: e => e.amp * (-5 * e.s.head.v + .6 * e.n(e.t * .9 + 2)) },
  },
  layers: [
    { name: "fig", noHole: true, blur: 0, step: 10,
      poly: [[360,200],[680,200],[780,1100],[290,1100]],
      bones: [
        // 胡须轻动（下端摆动，根部不动）
        { wave: 1, w: W.mul(W.cap(510, 520, 505, 660, 30, 60), W.bandY(500, 600)),
          ph: (x, y, e) => e.t * 1.3 - y * .02, ax: e => e.s.beard.x * 2.2 + .8 * e.amp, ay: e => .3 * e.amp },
        // 头部微动（以颈为轴；冠顶与胡须一起）
        { rot: [510, 520], w: W.max(W.ell(510, 360, 110, 150, .45), W.mul(W.cap(510, 480, 505, 640, 35, 70), W.bandY(700, 560))), a: e => e.s.head.x },
        // 呼吸
        { scale: [510, 1020], w: W.ell(520, 780, 170, 180, .55), sx: e => .003 * e.breath * e.amp, sy: e => .007 * e.breath * e.amp },
      ] },
  ],
  glows: [
    { x: ANKH[0], y: ANKH[1], r0: 10, r1: e => 80 + 10 * Math.sin(e.t * 1.1), color: [255, 235, 160], a: e => .2 + .1 * (.5 + .5 * Math.sin(e.t * 1.1)) },
    { x: ORB[0], y: ORB[1], r0: 15, r1: e => 95 + 10 * Math.sin(e.t * .9 + 1), color: [255, 235, 150], a: e => .2 + .1 * (.5 + .5 * Math.sin(e.t * .9 + 1)) },
  ],
  motes: { n: 14, rect: [58, 40, 1028, 1640], speed: [1.5, 4], dir: 1, color: [255, 230, 190] },
});
</script>
</body>
