<title>塔罗 · 宝剑九 Nine of Swords</title>

<body>
<nav class="nav"><a href="../index.html">← 全部牌面</a></nav>
<div class="stage"><div class="card" id="card"><canvas id="gl"></canvas><canvas id="fx"></canvas><div class="glare" id="glare"></div></div></div>
<p class="hint" id="hint">正在拆分图层…</p>
<script src="../assets/cards/RWSa-S-09.js"></script>
<script src="../engine/live2d-card.js"></script>
<script>
const { W } = Live2DCard;
// 啜泣：不规则的呼吸 + 吸气时的抽动颤抖
const sob = e => {
  const base = Math.sin(e.t * 1.5 + .6 * Math.sin(e.t * .37)) * (.7 + .3 * e.n(e.t * .4 + 3));
  const hitch = Math.max(0, Math.sin(e.t * 1.5)) * .35 * Math.sin(e.t * 17) * (.5 + .5 * e.n(e.t * .9));
  return base + hitch;
};
// 躯干：内部为 1，在轮廓边缘及被子交界处衰减到 0
const W_TORSO = W.mul(W.ell(570, 1060, 150, 175, .5), W.bandY(1235, 1170));
const W_HEAD = W.ell(720, 900, 85, 95, .5);

Live2DCard.run({
  title: "宝剑九 Nine of Swords",
  springs: {
    head: { k: 12, c: 4, target: e => e.amp * (.012 * e.n(e.t * .3 + 1) + .006 * sob(e)) },
    shud: { k: 60, c: 6, target: e => e.amp * 1.2 * sob(e) },
  },
  layers: [
    // 背后是黑底+蓝剑，抠不干净 → noHole + 轮廓内局部形变
    { name: "fig", blur: 1, step: 8, noHole: true,
      poly: [[640,785],[720,770],[805,795],[815,860],[780,960],[730,1000],[735,1120],[705,1250],[395,1250],[390,1100],[415,960],[480,875],[560,855],[620,825]],
      bones: [
        { rot: [660, 960], w: W_HEAD, a: e => e.s.head.x },
        { move: 1, w: W.max(W_HEAD, W.mul(W.ell(600, 960, 150, 110, .5), W.bandY(1150, 1000))), dy: e => -e.s.shud.x },
        { scale: [560, 1245], w: W_TORSO, sx: e => .004 * sob(e) * e.amp, sy: e => .008 * sob(e) * e.amp },
      ] },
  ],
  motes: { n: 8, rect: [58, 40, 1028, 1250], speed: [1, 3], dir: 1, color: [190, 215, 255] },
});
</script>
</body>
</html>
