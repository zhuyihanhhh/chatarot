<body>

<div class="stage"><div class="card" id="card"><canvas id="gl"></canvas><canvas id="fx"></canvas><div class="glare" id="glare"></div></div></div>
<p class="hint" id="hint">正在拆分图层…</p>
<script src="../assets/cards/RWSa-P-J1.js"></script>
<script src="../engine/live2d-card.js"></script>
<script>
const { W } = Live2DCard;
const COIN = [722, 297], CR = 108, CUT = 392;
// 星币圆轮廓：只取手指上方部分，手指以下归人物层
const COIN_POLY = Array.from({ length: 48 }, (_, i) => {
  const a = i / 48 * Math.PI * 2;
  return [Math.round(COIN[0] + Math.cos(a) * CR), Math.min(CUT, Math.round(COIN[1] + Math.sin(a) * CR))];
});
const streamer = W.mul(W.cap(300, 470, 310, 770, 30, 60), W.bandY(450, 640));
const float = e => .5 + .5 * Math.sin(e.t * .9);

Live2DCard.run({
  title: "星币侍从 Page of Pentacles",
  key: { colors: [[242, 226, 93], [246, 233, 93], [245, 230, 90]] },
  keepRects: [{ rect: [320, 1215, 600, 1265] }, { rect: [630, 380, 815, 400] }],
  springs: {
    sway:     { k: 8,  c: 4.5, target: e => e.amp * .004 * e.n(e.t * .3) + .004 * e.mx },
    head:     { k: 9,  c: 4.5, target: e => e.amp * .015 * e.n(e.t * .25 + 2) + .015 * e.mx },
    streamer: { k: 14, c: 1.6, force: e => e.amp * (e.wind * 2.5 * e.n(e.t * 1.1 + 4) - 4 * e.s.sway.a) },
  },
  layers: [
    { name: "fig", key: true, minus: ["coin"],
      poly: [[240,250],[300,190],[400,165],[480,175],[560,200],[600,250],[612,330],[640,410],[680,380],[770,385],[810,410],[795,450],[720,505],[680,530],[650,600],[640,700],[620,790],[610,830],[630,920],[655,1080],[640,1115],[600,1125],[575,1245],[320,1245],[330,1110],[290,1100],[300,1000],[330,880],[330,790],[290,780],[255,620],[255,480],[290,430],[255,330]],
      bones: [
        { wave: 1, w: streamer, ph: (x, y, e) => e.t * 1.6 - y * .012, ax: e => (1.5 + 3 * e.wind) * e.amp, ay: e => 0 },
        { rot: [310, 470], w: streamer, a: e => e.s.streamer.x * .5 },
        { rot: [455, 430], w: W.ell(450, 300, 120, 115, .5), a: e => e.s.head.x },
        { scale: [460, 1245], w: W.mul(W.ell(460, 640, 230, 260, .5), W.bandY(1240, 1000)), sx: e => .004 * e.breath * e.amp, sy: e => .008 * e.breath * e.amp },
        { rot: [450, 1245], w: W.bandY(1240, 1000), a: e => e.s.sway.x },
      ] },
    { name: "coin", key: true, poly: COIN_POLY,
      bones: [
        { scale: [COIN[0], CUT], w: W.bandY(CUT, CUT - 40), sx: e => .012 * e.amp * float(e), sy: e => .02 * e.amp * float(e) },
        { rot: [COIN[0], CUT], w: W.bandY(CUT, CUT - 30), a: e => e.amp * .025 * Math.sin(e.t * .7) },
      ] },
  ],
  glows: [
    { x: COIN[0], y: COIN[1], r0: 40, r1: e => 170 + 30 * float(e), color: [255, 235, 140], a: e => .18 + .14 * float(e) },
    { x: COIN[0], y: COIN[1], r1: 60, color: [255, 255, 220], a: e => .1 + .12 * Math.sin(e.t * 1.7) ** 2 },
  ],
  motes: { n: 24, rect: [58, 40, 1028, 1240], speed: [2, 5], dir: -1, color: [255, 230, 150] },
});
</script>
