<script src="../assets/cards/RWSa-P-06.js"></script>
<script src="../engine/live2d-card.js"></script>
<script>
const { W } = Live2DCard;
// 天空中的六枚星币
const COINS = [[100, 205], [500, 205], [905, 205], [100, 500], [905, 500], [100, 740]].map((c, i) => ({ c, ph: i * 1.7 }));
const shine = (s, e) => .5 + .5 * Math.sin(e.t * 1.2 + s.ph);
const PIVOT = [885, 675];
// 天平：从握点向下，左侧进入红袍处衰减为 0
const W_SCALE = W.mul(W.ell(915, 850, 140, 190, .35), W.bandY(660, 700), W.bandX(800, 845), W.bandX(1022, 1006), W.bandY(1045, 1005));
// 施舍的手：腕部以内为 0
const W_HAND = W.mul(W.ell(318, 1005, 95, 55, .45), W.bandX(410, 370));
// 左乞丐：贴左边框和底部为 0
const W_BEG_L = W.mul(W.ell(190, 1340, 140, 220, .45), W.bandX(70, 130), W.bandY(1560, 1460));
// 右乞丐：贴右边框为 0
const W_BEG_R = W.mul(W.ell(860, 1380, 130, 230, .45), W.bandX(1015, 960), W.bandY(1600, 1500));

Live2DCard.run({
  title: "星币六 Six of Pentacles",
  art: [58, 40, 1028, 1752],
  springs: {
    pend: { k: 6, c: .5, force: e => e.amp * .03 * e.n(e.t * .5 + 3) },
    give: { k: 14, c: 5, target: e => e.amp * .025 * e.n(e.t * .45 + 1) },
  },
  layers: [
    // 背景是网点纸纹 → noHole + 轮廓内衰减
    { name: "scale", blur: 1, step: 6, noHole: true,
      poly: [[820,640],[920,640],[1030,780],[1030,1000],[820,1000]],
      bones: [{ rot: PIVOT, w: W_SCALE, a: e => .5 * e.amp * .02 * Math.sin(e.t * 1.1) + e.s.pend.x }] },
    { name: "hand", blur: 1, step: 6, noHole: true,
      poly: [[230,960],[330,920],[420,920],[420,1060],[240,1060]],
      bones: [{ rot: [400, 965], w: W_HAND, a: e => e.s.give.x }] },
    { name: "begL", blur: 1, step: 8, noHole: true,
      poly: [[60,1050],[180,1010],[300,1050],[380,1300],[330,1600],[60,1600]],
      bones: [{ scale: [200, 1580], w: W_BEG_L, sx: e => .004 * e.breath * e.amp, sy: e => .009 * e.breath * e.amp }] },
    { name: "begR", blur: 1, step: 8, noHole: true,
      poly: [[700,1100],[820,1060],[1028,1150],[1028,1620],[680,1620]],
      bones: [{ scale: [850, 1600], w: W_BEG_R, sx: e => .004 * e.breath * e.amp, sy: e => .008 * e.breath * e.amp }] },
  ],
  glows: COINS.map(s => ({ x: s.c[0], y: s.c[1], r0: 40, r1: e => 170 + 20 * shine(s, e), color: [255, 220, 120], a: e => .08 + .14 * shine(s, e) })),
  motes: { n: 18, rect: [58, 40, 1028, 1000], speed: [2, 5], dir: -1, color: [255, 230, 160] },
});
</script>
