<div class="stage"><div class="card" id="card"><canvas id="gl"></canvas><canvas id="fx"></canvas><div class="glare" id="glare"></div></div></div>
<p class="hint" id="hint">正在拆分图层…</p>
<script src="../assets/cards/RWSa-T-09.js"></script>
<script src="../engine/live2d-card.js"></script>
<script>
const { W, smooth } = Live2DCard;
const HAND = [150, 238], STAR = [150, 410];
// 提灯：挂钩上端贴手，权重从 0 渐变；左侧光芒贴边框，左缘归零（配合 keepRects）
const W_LAN = (x, y) => smooth(245, 272, y) * smooth(62, 82, x);
// 斗篷：下摆贴雪地、兜帽贴 IX 标题框，两端权重归零
const W_FIG = (x, y) => smooth(1585, 1540, y) * smooth(135, 175, y);
const flick = e => .55 + .25 * e.n(e.t * 3.1) + .2 * e.n(e.t * 7.3 + 2);

Live2DCard.run({
  title: "IX 隐士 The Hermit",
  key: { colors: [[110, 144, 150], [104, 138, 144], [99, 133, 139], [98, 132, 139], [106, 139, 144], [105, 143, 151], [100, 136, 144]] },
  keepRects: [
    { rect: [40, 320, 72, 540] },          // 提灯左光芒 + 左边框
    { rect: [420, 55, 640, 150] },         // 兜帽 + IX 标题框
    { rect: [300, 1530, 820, 1620] },      // 下摆 + 雪地
  ],
  springs: {
    head: { k: 9,  c: 4.5, target: e => e.amp * .015 * e.n(e.t * .2 + 1) + .01 * e.mx },
    lan:  { k: 6,  c: .5,  target: e => e.amp * .03 * Math.sin(e.t * 1.25), force: e => e.amp * e.wind * .3 * e.n(e.t * .7 + 4) },
    hem:  { k: 20, c: 3,   force: e => e.amp * e.wind * 30 * e.n(e.t * .8 + 2) },
  },
  layers: [
    { name: "fig", key: true, minus: ["lan"], blur: 1, step: 12,
      poly: [[110,170],[220,160],[300,185],[380,150],[440,128],[470,108],[565,108],[605,140],[665,200],[735,270],[755,350],[750,700],[765,1000],[785,1300],[795,1590],[320,1590],[345,1300],[360,1100],[318,800],[298,600],[262,560],[262,520],[248,285],[200,262],[110,252]],
      bones: [
        // 胡须
        { wave: 1, w: W.ell(520, 400, 70, 95, .5), ph: (x, y, e) => e.t * 1.5 - y * .03, ax: e => (.8 + .8 * e.wind) * e.amp, ay: e => .4 * e.amp },
        // 头部
        { rot: [500, 470], w: W.ell(495, 330, 110, 120, .45), a: e => e.s.head.x },
        // 斗篷下摆
        { wave: 1, w: (x, y) => smooth(1250, 1420, y) * W_FIG(x, y), ph: (x, y, e) => e.t * 1.1 - x * .012 - y * .006, ax: e => e.s.hem.x * .12 + 1.2 * e.amp, ay: e => .5 * e.amp },
        // 呼吸
        { scale: [520, 1500], w: (x, y) => W.ell(520, 640, 240, 280, .6)(x, y) * W_FIG(x, y), sx: e => .004 * e.breath * e.amp, sy: e => .008 * e.breath * e.amp },
      ] },
    { name: "lan", key: true, blur: .8, step: 8,
      poly: [[118,248],[182,248],[205,290],[240,330],[264,380],[264,522],[225,548],[85,548],[62,522],[62,330],[105,290]],
      bones: [{ rot: HAND, w: W_LAN, a: e => e.s.lan.x }] },
  ],
  glows: [
    { x: STAR[0], y: STAR[1], r0: 10, r1: e => 120 + 40 * flick(e), color: [255, 225, 140], a: e => .18 + .22 * flick(e) },
    { x: STAR[0], y: STAR[1], r1: e => 38 + 10 * flick(e), color: [255, 250, 220], a: e => .25 + .3 * flick(e) },
  ],
  motes: { n: 40, rect: [58, 40, 1028, 1590], speed: [10, 24], dir: -1, color: [240, 246, 255] },
});
</script>
