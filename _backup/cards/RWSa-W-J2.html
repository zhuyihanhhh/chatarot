<div class="stage"><div class="card" id="card"><canvas id="gl"></canvas><canvas id="fx"></canvas><div class="glare" id="glare"></div></div></div>

<script src="../assets/cards/RWSa-W-J2.js"></script>
<script src="../engine/live2d-card.js"></script>
<script>
const { W } = Live2DCard;
// 头盔羽饰：根部（盔顶 ~840,330）为 0，越往外越大
const plume = W.mul(W.ell(905, 320, 115, 130, .5), W.bandX(835, 880));
// 袖口两处火焰羽饰（根部靠手臂一侧为 0）
const sleeve = W.max(
  W.mul(W.ell(930, 690, 70, 60, .5), W.bandX(890, 925)),
  W.mul(W.ell(945, 860, 75, 65, .5), W.bandX(895, 935)));
// 马鬃：头顶卷毛，下沿衰减
const mane = W.mul(W.ell(270, 640, 160, 80, .5), W.bandY(720, 640));
// 马尾：右侧黑色卷毛，贴右边框处为 0
const tail = W.mul(W.ell(955, 1170, 75, 95, .5), W.bandX(1020, 985), W.bandX(880, 920));
const head = W.max(W.ell(625, 420, 105, 115, .5), plume);
// 马身整体以后腿为轴：截断线（地面 y≈1460）、左侧前蹄贴框、右边框、顶边框处权重为 0
const body = W.mul(W.bandY(1460, 1260), W.bandX(70, 200), W.bandX(1028, 985), W.bandY(45, 120));
const PIVOT = [900, 1540];

Live2DCard.run({
  title: "权杖骑士 Knight of Wands",
  key: { colors: [[189,222,235],[156,207,225],[226,238,238],[175,216,225],[213,232,237],[174,214,229],[183,220,232],[195,221,229],[201,221,227],[165,211,229]], lo: 28, hi: 52 },
  keepRects: [
    { rect: [58, 1440, 1028, 1480] },  // 马/腿截断线
    { rect: [58, 40, 1028, 62] },      // 顶边框
  ],
  springs: {
    rear:  { k: 6,  c: 3.5, target: e => e.amp * .005 * Math.sin(e.t * .9) + .002 * e.mx },
    head:  { k: 9,  c: 4.5, target: e => e.amp * .02 * e.n(e.t * .25 + 1) + .015 * e.mx - .01 * e.my },
    plume: { k: 40, c: 2.4, force: e => e.amp * (e.wind * 3 * e.n(e.t * 1.6 + 2) - 4 * e.s.head.a - 8 * e.s.rear.a) },
    mane:  { k: 30, c: 2.2, force: e => e.amp * (e.wind * 3 * e.n(e.t * 1.3 + 6) - 10 * e.s.rear.a) },
  },
  layers: [
    { name: "main", key: true, blur: 1, step: 10,
      poly: [[58,560],[225,560],[400,45],[640,45],[640,200],[820,190],[1028,150],[1028,1470],[58,1470]],
      bones: [
        { wave: 1, w: plume, ph: (x, y, e) => e.t * 2.6 - x * .03 - y * .01, ax: e => (1.5 + 3 * e.wind) * e.amp, ay: e => (1.5 + 3 * e.wind) * e.amp + e.s.plume.x * 30 },
        { wave: 1, w: sleeve, ph: (x, y, e) => e.t * 3 - x * .04 - y * .01, ax: e => (1 + 2 * e.wind) * e.amp, ay: e => (1.2 + 2.5 * e.wind) * e.amp },
        { wave: 1, w: mane, ph: (x, y, e) => e.t * 2.2 + x * .03, ax: e => (1 + 2 * e.wind) * e.amp + e.s.mane.x * 25, ay: e => (1 + 1.5 * e.wind) * e.amp },
        { wave: 1, w: tail, ph: (x, y, e) => e.t * 2 - y * .03, ax: e => (1 + 2 * e.wind) * e.amp + e.s.mane.x * 15, ay: e => .6 * e.amp },
        { rot: [640, 525], w: head, a: e => e.s.head.x },
        { scale: [620, 900], w: W.mul(W.ell(620, 720, 170, 190, .55), W.bandY(900, 820)), sx: e => .004 * e.breath * e.amp, sy: e => .008 * e.breath * e.amp },
        { rot: PIVOT, w: body, a: e => e.s.rear.x },
      ] },
  ],
  glows: [
    { x: 900, y: 330, r0: 20, r1: e => 150 + 15 * Math.sin(e.t * 2), color: [255, 140, 70], a: e => .08 + .05 * Math.sin(e.t * 2) },
  ],
  motes: { n: 22, rect: [58, 1460, 1028, 1640], speed: [3, 8], color: [255, 220, 160] },
});
</script>
