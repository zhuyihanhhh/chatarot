const { W } = Live2DCard;
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const ring = (cx, cy, rx, ry, n = 24) => Array.from({ length: n }, (_, i) => [cx + Math.cos(i / n * 6.2832) * rx, cy + Math.sin(i / n * 6.2832) * ry]);

// 日轮描边约 r≈241：光芒层一直包到描边内侧（minusCircles 230，切口落在纯黄日面里，补洞色也是黄色），
// r<310 权重为 0，描边与光芒根部不动，避免补洞把黑描边混成灰环露出来
const rayW = (x, y) => sm(310, 450, Math.hypot(x - SUN[0], y - SUN[1])) * (1 - sm(500, 610, y)) * sm(58, 130, x) * (1 - sm(790, 880, x)) * sm(100, 170, y);
// 旗：旗杆顶处为 0，向外增大；右侧贴画框的一段为 0
const segD = (ax, ay, bx, by) => (x, y) => { const vx = bx - ax, vy = by - ay, t = Math.max(0, Math.min(1, ((x - ax) * vx + (y - ay) * vy) / (vx * vx + vy * vy))); return Math.hypot(x - ax - vx * t, y - ay - vy * t); };
const poleD = segD(948, 80, 915, 228);
const flagW = (x, y) => sm(15, 300, poleD(x, y)) * (1 - sm(900, 1040, y)) * (1 - sm(975, 1020, x) * sm(380, 440, y) * (1 - sm(790, 860, y)));

const tailLD = (x, y) => Math.min(...TAIL_L.slice(1).map((b, i) => segD(...TAIL_L[i], ...b)(x, y)));
const tailW = W.mul(W.bandY(1075, 1190), (x, y) => 1 - sm(1500, 1610, y), (x, y) => sm(18, 70, tailLD(x, y)));
const FL = [[118, 822, 82, 80], [268, 845, 80, 80], [453, 830, 90, 85], [950, 1000, 82, 80]];
const flW = FL.map(([cx, cy, rx, ry]) => W.ell(cx, cy, rx + 10, ry + 10, .3));
const edgeL = W.bandX(58, 95), edgeR = (x, y) => 1 - sm(995, 1028, x);
const featherW = W.cap(375, 900, 400, 740, 18, 40);
const armL = W.cap(375, 1125, 175, 1222, 30, 62), armR = W.cap(545, 1062, 690, 1045, 24, 52);

      bones: [

        { move: 1, w: tailW, dx: e => e.s.gust.x * .8 },

    { name: "horse", minus: ["child", "tail"], blur: 1.2,
