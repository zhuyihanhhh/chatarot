<body>
<nav class="nav"><a href="../index.html">← 全部牌面</a></nav>
<div class="stage"><div class="card" id="card"><canvas id="gl"></canvas><canvas id="fx"></canvas><div class="glare" id="glare"></div></div></div>
<p class="hint" id="hint">正在拆分图层…</p>
<script src="../assets/cards/RWSa-C-J1.js"></script>
<script src="../engine/live2d-card.js"></script>
<script>
const { W } = Live2DCard;
// 杯中的鱼：杯口（y≈505）处权重为 0，越往上越自由
const W_FISH = W.bandY(505, 478);
// 头部（含帽子）：脖子/垂巾截断处（y≈470）权重为 0
const W_HEAD = W.bandY(468, 432);
// 帽子左侧飘巾：远离帽身（x>455）处衰减为 0
const W_FLAP = W.mul(W.ell(405, 365, 58, 90, .5), W.bandX(458, 425));
// 海面波光点（蓝色水带内，避开双腿）
const GLINTS = [
  [95, 1335], [170, 1350], [240, 1328], [455, 1338], [640, 1342], [760, 1330], [850, 1345], [960, 1335],
  [120, 1395], [215, 1410], [460, 1400], [650, 1405], [745, 1395], [880, 1410], [990, 1398], [300, 1372],
];

Live2DCard.run({
  title: "圣杯侍从 Page of Cups",
  key: { colors: [[212, 203, 201], [222, 215, 213], [202, 192, 190]] },
  keepRects: [
    { rect: [222, 494, 348, 522] },   // 鱼与杯口交界
    { rect: [430, 458, 760, 500] },   // 头部 / 垂巾截断线
    { rect: [625, 380, 705, 470], except: ["head"] },   // 发梢与垂巾之间被黑线包围的小块背景
  ],
  springs: {
    head: { k: 9,  c: 4.5, target: e => e.amp * .025 * e.n(e.t * .25 + 1) + .02 * e.mx - .01 * e.my },
    fish: { k: 6,  c: 2.5, target: e => e.amp * (.5 + .5 * Math.sin(e.t * .9)) },
    flap: { k: 30, c: 2.5, force: e => e.amp * (e.wind * 4 * e.n(e.t * 1.6 + 3) - 1.5 * e.s.head.a) },
  },
  layers: [
    { name: "body", blur: 1, step: 8, noHole: true,
      poly: [[420,560],[700,540],[800,600],[830,800],[760,960],[420,980],[360,760],[380,620]],
      bones: [
        { scale: [590, 1080], w: W.ell(590, 760, 170, 170, .5), sx: e => .004 * e.breath * e.amp, sy: e => .008 * e.breath * e.amp },
      ] },
    { name: "head", key: true, blur: .8,
      poly: [[362,285],[398,255],[440,248],[480,268],[540,262],[600,242],[662,248],[718,282],[742,340],[748,440],[748,470],[430,470],[385,445],[358,400]],
      bones: [
        { wave: 1, w: W_FLAP, ph: (x, y, e) => e.t * 2.4 - y * .03 + x * .01, ax: e => (1.5 + 3 * e.wind) * e.amp, ay: e => .8 * e.amp },
        { rot: [440, 330], w: W_FLAP, a: e => e.s.flap.x * .02 },
        { rot: [570, 480], w: W_HEAD, a: e => e.s.head.x },
      ] },
    { name: "fish", key: true, blur: .8,
      poly: [[226,470],[250,453],[275,442],[300,435],[324,437],[342,452],[340,476],[332,496],[326,506],[244,505],[230,490]],
      bones: [
        { move: 1, w: W_FISH, dy: e => -3 * e.s.fish.x, dx: e => e.amp * .8 * Math.sin(e.t * .7) },
        { rot: [285, 506], w: W_FISH, a: e => e.amp * (.05 * Math.sin(e.t * .9 + .6) + .015 * e.n(e.t * .5)) },
      ] },
  ],
  glows: [
    { x: 250, y: 520, r0: 20, r1: e => 150 + 20 * Math.sin(e.t * 1.1), color: [255, 240, 170], a: e => .1 + .05 * Math.sin(e.t * 1.1) },
  ],
  motes: { n: 16, rect: [58, 40, 1028, 1280], speed: [2, 5], dir: -1, color: [235, 245, 255] },
  fx(g, e) {
    g.save(); g.globalCompositeOperation = "lighter";
    GLINTS.forEach(([x, y], i) => {
      const k = Math.max(0, Math.sin(e.t * 1.2 + i * 2.17));
      const a = .45 * k * k;
      if (a < .01) return;
      const dx = 6 * Math.sin(e.t * .6 + i), L = 10 + 14 * k;
      const gr = g.createLinearGradient(x + dx - L, y, x + dx + L, y);
      gr.addColorStop(0, "rgba(235,250,255,0)"); gr.addColorStop(.5, `rgba(235,250,255,${a})`); gr.addColorStop(1, "rgba(235,250,255,0)");
      g.fillStyle = gr; g.beginPath(); g.ellipse(x + dx, y, L, 1.8, 0, 0, 7); g.fill();
    });
    g.restore();
  },
});
</script>
