<div class="stage"><div class="card" id="card"><canvas id="gl"></canvas><canvas id="fx"></canvas><div class="glare" id="glare"></div></div></div>
<p class="hint" id="hint">正在拆分图层…</p>
<script src="../assets/cards/RWSa-C-06.js"></script>
<script src="../engine/live2d-card.js"></script>
<script>
const { W } = Live2DCard;
// 六朵白花：花心、半径、相位（背景繁杂 → 轮廓内局部形变，边缘权重衰减为 0）
const FLOWERS = [
  { c: [277, 664], r: 46, ph: 0.0 },
  { c: [660, 925], r: 44, ph: 1.7 },
  { c: [215, 1455], r: 46, ph: 3.1 },
  { c: [373, 1440], r: 46, ph: 4.6 },
  { c: [645, 1455], r: 46, ph: 2.3 },
  { c: [900, 1455], r: 46, ph: 5.4 },
];
const box = ([x, y], r) => [[x - r * 1.6, y - r * 1.6], [x + r * 1.6, y - r * 1.6], [x + r * 1.6, y + r * 1.6], [x - r * 1.6, y + r * 1.6]];

Live2DCard.run({
  title: "圣杯六 Six of Cups",
  springs: {
    boy:  { k: 9,  c: 4.5, target: e => e.amp * .018 * e.n(e.t * .25 + 1) + .01 * e.mx },
    girl: { k: 10, c: 4.5, target: e => e.amp * .022 * e.n(e.t * .3 + 5) - .01 * e.mx },
    ...Object.fromEntries(FLOWERS.map((f, i) => [`f${i}`, { k: 35, c: 2.4, force: e => e.amp * e.wind * 3.2 * e.n(e.t * 1.3 + f.ph) }])),
  },
  layers: [
    ...FLOWERS.map((f, i) => ({
      name: `fl${i}`, noHole: true, blur: 0, step: 6, poly: box(f.c, f.r),
      bones: [{ rot: [f.c[0], f.c[1] + f.r * .7], w: W.ell(f.c[0], f.c[1], f.r * 1.15, f.r * 1.05, .55), a: e => e.s[`f${i}`].x }],
    })),
    { name: "boy", noHole: true, blur: 0, step: 10, poly: [[300, 680], [720, 680], [720, 1380], [300, 1380]],
      minus: ["fl1"],
      bones: [
        { rot: [560, 960], w: W.mul(W.ell(560, 830, 120, 120, .55), W.bandY(690, 760)), a: e => e.s.boy.x },
        { scale: [480, 1340], w: W.ell(470, 1120, 150, 170, .55), sx: e => .004 * e.breath * e.amp, sy: e => .008 * e.breath * e.amp },
      ] },
    { name: "girl", noHole: true, blur: 0, step: 8, poly: [[730, 880], [960, 880], [960, 1360], [730, 1360]],
      bones: [
        { rot: [840, 1080], w: W.mul(W.ell(845, 985, 90, 95, .55), W.bandY(890, 940)), a: e => e.s.girl.x },
        { scale: [840, 1330], w: W.ell(840, 1170, 80, 120, .55), sx: e => .004 * e.breath * e.amp, sy: e => .008 * e.breath * e.amp },
      ] },
  ],
  glows: [
    { x: 600, y: 300, r0: 80, r1: e => 520 + 40 * Math.sin(e.t * .7), color: [255, 225, 160], a: e => .12 + .05 * Math.sin(e.t * .7) },
    ...FLOWERS.map(f => ({ x: f.c[0], y: f.c[1], r1: e => 70 + 10 * Math.sin(e.t * 1.3 + f.ph), color: [255, 250, 230], a: e => .1 + .07 * Math.sin(e.t * 1.3 + f.ph) })),
  ],
  motes: { n: 34, rect: [58, 40, 1028, 1645], color: [255, 222, 160] },
});
</script>
